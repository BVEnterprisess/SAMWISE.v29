name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  documentation:
    name: Documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require canonical documents
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENTS.md
          test -f docs/GRADIENT.md
          test -f docs/closure-agent-brief.md
          test -f docs/superpowers/specs/2026-08-02-yantrikdb-metaclaw-closure-contract.md
          test -f docs/superpowers/plans/2026-08-02-asset-contract-falsification.md
          test -f YANTRIKDB.md
      - name: Reject unresolved placeholders in authoritative docs
        shell: bash
        run: ./scripts/check-placeholders.sh
      - name: Reject reappearance of the archived sidecar
        shell: bash
        run: |
          set -euo pipefail
          test ! -d samwise-core || { echo 'samwise-core belongs on archive/samwise-core-v0' >&2; exit 1; }
