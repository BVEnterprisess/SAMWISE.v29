name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  documentation:
    name: Documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require canonical documents
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENTS.md
          test -f docs/GRADIENT.md
          test -f docs/closure-agent-brief.md
          test -f docs/superpowers/specs/2026-08-02-yantrikdb-metaclaw-closure-contract.md
          test -f docs/superpowers/plans/2026-08-02-asset-contract-falsification.md
          test -f YANTRIKDB.md
      - name: Reject unresolved placeholders in authoritative docs
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^A-Za-z])(TBD|FIXME)([^A-Za-z]|$)' README.md AGENTS.md YANTRIKDB.md docs; then
            echo 'Unresolved documentation placeholder found.' >&2
            exit 1
          fi

  rust:
    name: Rust sidecar checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samwise-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check compilation
        run: cargo check --all-targets
      - name: Run tests
        run: cargo test --all-targets
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
